server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**

            - id: productos
              uri: http://localhost:8082
              predicates:
                - Path=/api/productos/**
jwt:
  secret: mi-clave-super-secreta-para-el-gateway-de-inostratech-2026